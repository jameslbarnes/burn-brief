<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>burn/brief</title>
<style>
  /* ============================================================
     PORCELAIN FUTURISM
     A private newspaper crossed with a next-generation OS.
     Warm porcelain field, no boxes — hairlines and a left margin
     rail carry the structure. Cobalt appears only where action
     lives; sienna is the single secondary signal for deadlines.
     ============================================================ */

  :root {
    /* porcelain field */
    --bg:        #FAF7F1;
    --bg-raise:  #FFFEFB;
    --ink:       #191612;
    --ink-2:     #57503F;   /* body-muted */
    --ink-3:     #8D8471;   /* micro-labels */
    --hairline:  #E6DFD1;
    --hairline-2:#D5CCB9;   /* interactive edges */

    /* the one deep accent — action color (porcelain cobalt) */
    --act:      #1E3EAC;
    --act-deep: #16307F;
    --on-act:   #F7F4EC;

    /* single secondary signal, deadlines only */
    --due: #A8431C;

    --display: "Didot", "Bodoni 72", "Charter", Georgia, serif;
    --serif:   "Charter", "Iowan Old Style", Georgia, serif;
    --sans:    "Avenir Next", Avenir, "Helvetica Neue", system-ui, sans-serif;
    --mono:    ui-monospace, "SF Mono", Menlo, monospace;

    --backdrop-scene: url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201400%20900%22%20preserveAspectRatio=%22xMidYMax%20slice%22%3E%3Ccircle%20cx=%221060%22%20cy=%22320%22%20r=%22150%22%20fill=%22%23B4531F%22%20opacity=%220.10%22/%3E%3Ccircle%20cx=%221060%22%20cy=%22320%22%20r=%22270%22%20fill=%22%23B4531F%22%20opacity=%220.045%22/%3E%3Cpath%20d=%22M0%20560%20L180%20502%20L340%20556%20L520%20484%20L660%20546%20L840%20506%20L1010%20560%20L1180%20497%20L1400%20550%20L1400%20900%20L0%20900%20Z%22%20fill=%22%236E5D45%22%20opacity=%220.10%22/%3E%3Cpath%20d=%22M0%20622%20L220%20578%20L430%20626%20L640%20588%20L860%20630%20L1080%20592%20L1400%20636%20L1400%20900%20L0%20900%20Z%22%20fill=%22%236E5D45%22%20opacity=%220.15%22/%3E%3Crect%20y=%22656%22%20width=%221400%22%20height=%22244%22%20fill=%22%23B4531F%22%20opacity=%220.055%22/%3E%3Cellipse%20cx=%22700%22%20cy=%22658%22%20rx=%22920%22%20ry=%2242%22%20fill=%22%23FFF6EA%22%20opacity=%220.4%22/%3E%3C/svg%3E");
  }

  /* Playa: the same porcelain structure mapped onto dust and ember.
     Palette swap only — zero structural difference. */
  :root.playa {
    --bg:        #F5EDE0;
    --bg-raise:  #FCF6EA;
    --ink:       #2A2118;
    --ink-2:     #6E5D45;
    --ink-3:     #9A8868;
    --hairline:  #E4D6BC;
    --hairline-2:#D2BF9E;
    --act:      #B4531F;   /* ember takes cobalt's chair */
    --act-deep: #8A3A10;
    --on-act:   #FFF6EA;
    --due:      #8C5A12;   /* dusk gold for deadlines */
  }

    }
    :root.playa {
      --bg:        #171210;
      --bg-raise:  #1E1813;
      --ink:       #F0E7D8;
      --ink-2:     #B5A489;
      --ink-3:     #857659;
      --hairline:  #322A1F;
      --hairline-2:#453927;
      --act:      #E0813D;   /* firelight */
      --act-deep: #EE9A5C;
      --on-act:   #201206;
      --due:      #D9A845;
      --backdrop-scene: url("data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%201400%20900%22%20preserveAspectRatio=%22xMidYMax%20slice%22%3E%3Cg%20fill=%22%23F0EAE0%22%3E%3Ccircle%20cx=%2290%22%20cy=%2280%22%20r=%221.3%22%20opacity=%220.6%22/%3E%3Ccircle%20cx=%22210%22%20cy=%22190%22%20r=%221%22%20opacity=%220.4%22/%3E%3Ccircle%20cx=%22330%22%20cy=%2260%22%20r=%221.5%22%20opacity=%220.7%22/%3E%3Ccircle%20cx=%22420%22%20cy=%22250%22%20r=%221%22%20opacity=%220.35%22/%3E%3Ccircle%20cx=%22520%22%20cy=%22120%22%20r=%221.2%22%20opacity=%220.55%22/%3E%3Ccircle%20cx=%22640%22%20cy=%2240%22%20r=%221%22%20opacity=%220.5%22/%3E%3Ccircle%20cx=%22730%22%20cy=%22210%22%20r=%221.4%22%20opacity=%220.6%22/%3E%3Ccircle%20cx=%22850%22%20cy=%2290%22%20r=%221%22%20opacity=%220.4%22/%3E%3Ccircle%20cx=%22960%22%20cy=%22270%22%20r=%221.2%22%20opacity=%220.5%22/%3E%3Ccircle%20cx=%221050%22%20cy=%2260%22%20r=%221%22%20opacity=%220.6%22/%3E%3Ccircle%20cx=%221170%22%20cy=%22230%22%20r=%221.4%22%20opacity=%220.55%22/%3E%3Ccircle%20cx=%221290%22%20cy=%22110%22%20r=%221%22%20opacity=%220.45%22/%3E%3Ccircle%20cx=%221360%22%20cy=%22300%22%20r=%221.2%22%20opacity=%220.5%22/%3E%3Ccircle%20cx=%22160%22%20cy=%22330%22%20r=%221%22%20opacity=%220.35%22/%3E%3Ccircle%20cx=%22300%22%20cy=%22400%22%20r=%221.2%22%20opacity=%220.45%22/%3E%3Ccircle%20cx=%22560%22%20cy=%22340%22%20r=%221%22%20opacity=%220.4%22/%3E%3Ccircle%20cx=%22760%22%20cy=%22380%22%20r=%221.3%22%20opacity=%220.5%22/%3E%3Ccircle%20cx=%22980%22%20cy=%22410%22%20r=%221%22%20opacity=%220.35%22/%3E%3Ccircle%20cx=%221230%22%20cy=%22370%22%20r=%221.2%22%20opacity=%220.45%22/%3E%3Ccircle%20cx=%2260%22%20cy=%22470%22%20r=%221%22%20opacity=%220.3%22/%3E%3Ccircle%20cx=%22450%22%20cy=%22470%22%20r=%221.1%22%20opacity=%220.4%22/%3E%3Ccircle%20cx=%22690%22%20cy=%22500%22%20r=%221%22%20opacity=%220.3%22/%3E%3Ccircle%20cx=%22900%22%20cy=%22480%22%20r=%221.2%22%20opacity=%220.4%22/%3E%3Ccircle%20cx=%221120%22%20cy=%22500%22%20r=%221%22%20opacity=%220.35%22/%3E%3Ccircle%20cx=%221340%22%20cy=%22460%22%20r=%221.1%22%20opacity=%220.4%22/%3E%3C/g%3E%3Ccircle%20cx=%221130%22%20cy=%22170%22%20r=%2252%22%20fill=%22%23F0EAE0%22%20opacity=%220.14%22/%3E%3Cellipse%20cx=%22700%22%20cy=%22650%22%20rx=%22780%22%20ry=%22120%22%20fill=%22%23E0813D%22%20opacity=%220.10%22/%3E%3Cpath%20d=%22M0%20560%20L180%20502%20L340%20556%20L520%20484%20L660%20546%20L840%20506%20L1010%20560%20L1180%20497%20L1400%20550%20L1400%20900%20L0%20900%20Z%22%20fill=%22%23000000%22%20opacity=%220.35%22/%3E%3Cpath%20d=%22M0%20622%20L220%20578%20L430%20626%20L640%20588%20L860%20630%20L1080%20592%20L1400%20636%20L1400%20900%20L0%20900%20Z%22%20fill=%22%23000000%22%20opacity=%220.5%22/%3E%3Crect%20y=%22656%22%20width=%221400%22%20height=%22244%22%20fill=%22%23E0813D%22%20opacity=%220.05%22/%3E%3C/svg%3E");

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    min-width: 720px;
  }
  ::selection { background: var(--act); color: var(--on-act); }

  /* ---- playa backdrop: user photos in ~/.burn-brief/backdrops, or
     the drawn dust-horizon scene; a porcelain wash keeps text sovereign ---- */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background-image: var(--backdrop-photo, var(--backdrop-scene));
    background-size: cover; background-position: center bottom; background-repeat: no-repeat;
  }
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 82%, transparent),
      color-mix(in srgb, var(--bg) 90%, transparent) 26%,
      color-mix(in srgb, var(--bg) 88%, transparent) 70%,
      color-mix(in srgb, var(--bg) 76%, transparent));
  }
  /* photos need a firmer wash than the drawn scene to keep prose sovereign */
  body.has-photo::after {
    background: linear-gradient(180deg,
      color-mix(in srgb, var(--bg) 88%, transparent),
      color-mix(in srgb, var(--bg) 94%, transparent) 26%,
      color-mix(in srgb, var(--bg) 92%, transparent) 70%,
      color-mix(in srgb, var(--bg) 84%, transparent));
  }

  /* ---- micro-label: the connective tissue of the whole system ---- */
  .micro {
    font-family: var(--sans);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.19em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .micro b { font-weight: 700; color: var(--ink); letter-spacing: inherit; }
  .num { font-family: var(--mono); font-weight: 500; letter-spacing: 0.04em; }
  .rule { flex: 1; height: 1px; background: var(--hairline); align-self: center; }

  /* ---- buttons: pill default, cobalt only when primary ---- */
  button {
    font-family: var(--sans); font-size: 11px; font-weight: 700; letter-spacing: 0.13em;
    text-transform: uppercase; cursor: pointer;
    background: none; color: var(--ink);
    border: 1px solid var(--hairline-2); border-radius: 999px; padding: 8px 17px;
    transition: border-color 140ms, color 140ms, background 140ms, transform 60ms;
  }
  button:hover { border-color: var(--ink); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: 0.45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--act); outline-offset: 2px; }
  button.primary { background: var(--act); border-color: var(--act); color: var(--on-act); }
  button.primary:hover { background: var(--act-deep); border-color: var(--act-deep); }
  button.due { border-color: color-mix(in srgb, var(--due) 55%, transparent); color: var(--due); }
  button.due:hover { background: var(--due); border-color: var(--due); color: var(--on-act); }
  button.ghost {
    border: none; border-radius: 0; padding: 6px 2px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.16em;
    color: var(--ink-3); border-bottom: 1px solid transparent;
  }
  button.ghost:hover { color: var(--ink); border-bottom-color: var(--ink); background: none; }
  button.ghost.dismiss:hover { color: var(--due); border-bottom-color: var(--due); }

  /* ============================ MASTHEAD ============================ */
  header {
    position: sticky; top: 0; z-index: 2;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--ink);   /* one strong rule, newspaper masthead */
  }
  header .mast {
    max-width: 1140px; margin: 0 auto;
    display: flex; align-items: center; gap: 36px;
    padding: 16px 40px 14px;
  }
  .wordmark { display: flex; flex-direction: column; gap: 2px; }
  .wordmark .over { font-size: 9px; letter-spacing: 0.34em; color: var(--ink-3); font-weight: 600; }
  .wordmark .name { font-family: var(--display); font-size: 21px; letter-spacing: 0.02em; font-weight: 400; line-height: 1.1; }
  header .views { display: flex; gap: 30px; }
  header .views button {
    border: none; border-radius: 0; padding: 6px 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink-3); position: relative;
  }
  header .views button:hover { color: var(--ink); }
  header .views button.active { color: var(--ink); }
  header .views button.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -15px;
    height: 2px; background: var(--act);
  }
  header .spacer { flex: 1; }
  header .tminus {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.05em; white-space: nowrap;
    color: var(--due); border: 1px solid var(--due); border-radius: 999px; padding: 4px 12px;
    font-variant-numeric: tabular-nums;
  }
  header .last-run { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: 0.03em; white-space: nowrap; }
  header .last-run.error { color: var(--due); }
  header #runNow {
    background: none; border: 1px solid var(--hairline-2); color: var(--ink);
    font-size: 10.5px; letter-spacing: 0.16em; padding: 8px 18px;
  }
  header #runNow:hover { border-color: var(--act); color: var(--act); background: none; }
  header #runNow:active { background: var(--act); border-color: var(--act); color: var(--on-act); }

  .shell {
    max-width: 1140px; margin: 0 auto;
    display: flex; align-items: flex-start; gap: 46px;
    padding: 0 40px;
  }
  nav#side {
    flex: 0 0 158px; position: sticky; top: 84px;
    padding: 30px 0 0; display: flex; flex-direction: column; gap: 2px;
  }
  #side button {
    border: none; border-radius: 0; text-align: left;
    padding: 9px 12px 9px 14px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink-3); border-left: 2px solid transparent;
  }
  #side button:hover { color: var(--ink); background: none; }
  #side button.active { color: var(--ink); border-left-color: var(--act); }
  #side .count { font-family: var(--mono); color: var(--act); margin-left: 8px; letter-spacing: 0; }
  #side .sep { height: 1px; background: var(--hairline); margin: 14px 14px 14px 16px; }
  main { flex: 1; min-width: 0; padding: 0 0 120px; }

  /* links inside item/digest text — underlined, cobalt on hover */
  .ext-link {
    color: inherit; text-decoration: underline;
    text-decoration-color: var(--hairline-2); text-decoration-thickness: 1px; text-underline-offset: 3px;
    transition: text-decoration-color 140ms, color 140ms;
    word-break: break-all;
  }
  .ext-link:hover { color: var(--act); text-decoration-color: var(--act); }
  .ext-link:focus-visible { outline: 2px solid var(--act); outline-offset: 1px; }

  /* banner: an editorial aside carried by a cobalt margin rule, not a box */
  .banner {
    border-left: 2px solid var(--act);
    padding: 4px 0 6px 18px;
    margin: 28px 0 8px;
    font-size: 14px; color: var(--ink-2); max-width: 62ch;
  }
  .banner strong { color: var(--ink); }

  /* edition pager — each day is an edition */
  .day-nav {
    display: flex; align-items: baseline; gap: 14px;
    padding: 22px 0 2px;
  }
  .day-nav .day-label { color: var(--ink); font-weight: 700; }
  .day-nav button.ghost { font-size: 14px; letter-spacing: 0; padding: 2px 6px; }
  .day-nav #dayToday { margin-left: 4px; color: var(--act); }
  .digest.archive { opacity: 0.96; }
  .principle { margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--hairline); }
  .principle .p-name {
    font-family: var(--display); font-size: 26px; line-height: 1.15;
    margin-top: 10px; letter-spacing: 0.01em;
  }
  .principle .p-line {
    font-family: var(--serif); font-style: italic; font-size: 15px;
    color: var(--ink-3); max-width: 62ch; margin-top: 4px;
  }
  .principle .p-reflection {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.62;
    color: var(--ink); max-width: 62ch; margin-top: 14px;
  }
  .principle .p-tip {
    margin-top: 16px; padding: 10px 0 2px 16px;
    border-left: 2px solid var(--due);
    display: flex; flex-direction: column; gap: 3px;
  }
  .principle .p-tip .micro { color: var(--due); }
  .principle .p-tip-text { font-size: 14px; color: var(--ink-2); max-width: 60ch; }

  .bucket-head {
    margin: 30px 0 10px; display: flex; align-items: center; gap: 10px;
  }
  .bucket-head::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  .bucket-head.hot { color: var(--due); }

  /* empty states — a fleuron, not a card */
  .empty { padding: 64px 0 24px; text-align: center; }
  .empty .fleuron { font-family: var(--display); font-size: 18px; color: var(--ink-3); }
  .empty .line1 { margin-top: 12px; font-family: var(--serif); font-size: 16px; color: var(--ink); }
  .empty .line2 { margin-top: 8px; font-size: 11px; letter-spacing: 0.19em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }

  /* ========================= THE BRIEFING ========================= */
  .digest { padding-top: 44px; }
  .briefing-kicker { display: flex; align-items: baseline; gap: 16px; }
  .briefing-kicker .refresh {
    border: none; border-radius: 0; padding: 4px 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.19em;
    color: var(--ink-3); border-bottom: 1px solid transparent;
  }
  .briefing-kicker .refresh:hover { color: var(--act); border-bottom-color: var(--act); background: none; }
  .no-briefing { display: flex; align-items: center; gap: 22px; margin-top: 30px; }
  .no-briefing .quietline { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--ink-2); }

  .digest-headline {
    font-family: var(--display);
    font-weight: 400;
    font-size: 42px;
    line-height: 1.16;
    letter-spacing: 0.002em;
    margin: 26px 0 0;
    max-width: 21em;
    text-wrap: balance;
  }

  /* stats band — the OS pulse, quiet and numeric */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    margin-top: 40px;
    border-top: 1px solid var(--hairline);
    border-bottom: 1px solid var(--hairline);
  }
  .stat { padding: 16px 24px 18px 0; }
  .stat + .stat { border-left: 1px solid var(--hairline); padding-left: 24px; }
  .stat .n { font-family: var(--mono); font-size: 26px; font-weight: 400; letter-spacing: -0.01em; line-height: 1; }
  .stat .n.zero { color: var(--ink-3); }
  .stat .l { margin-top: 7px; }

  /* the read */
  .digest-narrative { margin-top: 40px; max-width: 62ch; }
  .digest-narrative p {
    font-family: var(--serif);
    font-size: 17.5px;
    line-height: 1.68;
    color: var(--ink);
    margin: 0 0 1.15em;
  }
  .digest-narrative p:last-child { margin-bottom: 0; }
  .digest-narrative p.lede { font-size: 19.5px; line-height: 1.6; }
  .digest-narrative p.lede::first-letter {
    font-family: var(--display);
    font-size: 64px; line-height: 0.82;
    float: left; padding: 8px 12px 0 0;
    color: var(--act);
  }

  /* follow-ups — a numbered ledger */
  .followups { margin-top: 56px; }
  .fu-head { display: flex; align-items: center; gap: 16px; margin-bottom: 4px; }
  .fu-row {
    display: grid; grid-template-columns: 64px 1fr 34px;
    gap: 0 8px; align-items: baseline;
    padding: 17px 0 18px;
    border-bottom: 1px solid var(--hairline);
  }
  .fu-row .idx { font-family: var(--mono); font-size: 12px; color: var(--ink-3); letter-spacing: 0.08em; }
  .fu-row .fu-main { display: flex; align-items: baseline; gap: 10px; }
  .fu-row .fu-title { font-family: var(--serif); font-size: 16.5px; font-weight: 700; letter-spacing: -0.005em; }
  .fu-row .fu-age { font-family: var(--mono); font-size: 10.5px; color: var(--due); white-space: nowrap; }
  .fu-row .fu-why { grid-column: 2; font-size: 13px; color: var(--ink-2); margin-top: 3px; max-width: 62ch; }
  .fu-check {
    grid-column: 3; grid-row: 1 / span 2; align-self: center; justify-self: end;
    width: 28px; height: 28px; padding: 0; border-radius: 999px;
    border: 1px solid var(--hairline-2); color: var(--ink-3);
    font-size: 13px; letter-spacing: 0; line-height: 1;
  }
  .fu-check:hover { border-color: var(--act); color: var(--act); }
  .fu-row.done .fu-title, .fu-row.done .fu-why { text-decoration: line-through; opacity: 0.45; }
  .fu-row.done .fu-check { background: var(--act); border-color: var(--act); color: var(--on-act); }
  .fu-row.done .fu-age { display: none; }

  /* ======================== THE LEDGER ======================== */
  .subtabs {
    display: flex; gap: 30px; align-items: baseline;
    border-bottom: 1px solid var(--ink);
    padding-bottom: 13px;
    margin-top: 64px;
  }
  .subtabs button {
    border: none; border-radius: 0; padding: 0;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.19em;
    color: var(--ink-3); position: relative;
  }
  .subtabs button:hover { color: var(--ink); background: none; }
  .subtabs button.active { color: var(--ink); }
  .subtabs button.active::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: -15px;
    height: 2px; background: var(--act);
  }
  .subtabs .sort { margin-left: auto; font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-3); }

  /* item rows: no cards, no boxes — a margin rail and hairlines */
  .card {
    display: grid;
    grid-template-columns: 168px 1fr;
    gap: 0 36px;
    padding: 30px 0 32px;
    border-bottom: 1px solid var(--hairline);
    position: relative;
    transition: background 140ms, opacity 160ms, transform 160ms;
  }
  .card:hover { background: var(--bg-raise); }
  .card:focus-visible { outline: 2px solid var(--act); outline-offset: -2px; }
  .card.leaving { opacity: 0; transform: translateX(8px); }

  /* new-item marker: a cobalt tick hanging in the left margin */
  .card .new-tick {
    position: absolute; left: -52px; top: 36px;
    width: 20px; height: 2px; background: var(--act);
  }

  .card .rail { display: flex; flex-direction: column; gap: 9px; padding-top: 5px; }
  .rail .type { font-size: 10.5px; font-weight: 700; letter-spacing: 0.19em; text-transform: uppercase; color: var(--ink); }
  .card.is-deadline .rail .type { color: var(--due); }
  .rail .when { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); letter-spacing: 0.03em; }
  .rail .src { font-size: 11px; color: var(--ink-3); line-height: 1.45; }
  .rail .srcn { font-family: var(--mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.05em; }
  .rail .conf { font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; color: var(--due); }
  .rail .conf::before {
    content: ""; display: inline-block; width: 4px; height: 4px; border-radius: 99px;
    background: none; border: 1px dashed var(--due); margin-right: 6px; vertical-align: 1px;
  }

  .card .body { max-width: 640px; min-width: 0; }
  .card .title {
    font-family: var(--serif); font-size: 21px; font-weight: 700;
    letter-spacing: -0.008em; line-height: 1.3;
  }
  .card.due-today .title::after {
    content: "Due today"; font-family: var(--sans); font-size: 10px; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase; color: var(--due);
    border: 1px solid color-mix(in srgb, var(--due) 45%, transparent);
    border-radius: 999px; padding: 3.5px 10px; margin-left: 12px; vertical-align: 3px; white-space: nowrap;
  }
  .card .summary { font-size: 14px; line-height: 1.62; color: var(--ink-2); margin-top: 8px; }

  .card details { margin-top: 14px; }
  .card details summary {
    cursor: pointer; list-style: none;
    font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-3); transition: color 140ms;
  }
  .card details summary::-webkit-details-marker { display: none; }
  .card details summary::before { content: "+ "; font-family: var(--mono); }
  .card details[open] summary::before { content: "− "; }
  .card details summary:hover { color: var(--ink); }
  .fieldgrid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 3px 20px; margin-top: 10px;
  }
  .fieldgrid dt { color: var(--ink-3); font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; padding-top: 2px; }
  .fieldgrid dd { font-family: var(--mono); font-size: 12px; color: var(--ink-2); letter-spacing: 0.01em; margin: 0; }

  .card .actions { display: flex; align-items: center; gap: 10px; margin-top: 18px; flex-wrap: wrap; opacity: 0.88; transition: opacity 140ms; }
  .card:hover .actions { opacity: 1; }
  .actions .push { flex: 1; }

  /* ========================= CALENDAR ========================= */
  .cal-head { display: flex; align-items: baseline; gap: 16px; padding-top: 44px; }
  .cal-head .month { font-family: var(--sans); }
  .cal-head .pager { display: flex; gap: 2px; }
  .cal-head .pager button {
    border-color: transparent; border-radius: 999px;
    width: 26px; height: 26px; padding: 0; color: var(--ink-3);
    font-size: 13px; line-height: 1; letter-spacing: 0; text-transform: none;
  }
  .cal-head .pager button:hover { color: var(--act); border-color: var(--hairline-2); background: none; }

  /* a 7-column grid ruled by hairlines — no filled boxes */
  .cal-grid {
    /* minmax(0,1fr): nowrap entry titles must truncate, never widen columns */
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    margin-top: 22px;
    border-top: 1px solid var(--hairline);
    border-left: 1px solid var(--hairline);
  }
  .cal-dow {
    border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
    padding: 7px 8px 8px;
    font-size: 9.5px; font-weight: 600; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .cal-day {
    border-right: 1px solid var(--hairline); border-bottom: 1px solid var(--hairline);
    min-height: 96px; min-width: 0; padding: 6px 7px 8px;
    transition: background 140ms;
  }
  .cal-day:hover { background: var(--bg-raise); }
  .cal-day .dnum {
    display: inline-flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 999px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  }
  .cal-day.other .dnum { color: var(--ink-3); opacity: 0.6; }
  .cal-day.today .dnum { background: var(--act); color: var(--on-act); font-weight: 700; }

  /* events as typographic entries: a thin cobalt tick, no pill backgrounds */
  .cal-ev {
    display: block; width: 100%; text-align: left;
    margin-top: 4px; padding: 1px 2px 1px 7px;
    border: none; border-radius: 0; border-left: 2px solid var(--act);
    font-family: var(--sans); font-size: 11.5px; font-weight: 500; line-height: 1.4;
    letter-spacing: 0; text-transform: none; color: var(--ink-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: color 140ms;
  }
  .cal-ev:hover { color: var(--act); border-color: var(--act); background: none; }
  .cal-ev.deadline { border-left-color: var(--due); color: var(--due); }
  .cal-ev.deadline:hover { color: var(--due); border-left-color: var(--due); text-decoration: underline; }
  .cal-more {
    display: block; margin-top: 3px; padding: 1px 2px 1px 9px;
    border: none; border-radius: 0;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em; text-transform: none;
    color: var(--ink-3);
  }
  .cal-more:hover { color: var(--act); background: none; }

  /* day detail — an editorial sidenote below the grid */
  #dayDetail { scroll-margin-top: 84px; }
  #dayDetail:not(:empty) { margin-top: 52px; }
  #dayDetail h3 {
    display: flex; align-items: center; gap: 16px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink); font-family: var(--sans);
  }
  #dayDetail h3::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }
  #dayDetail .card { padding: 24px 0 26px; }

  .undated { margin-top: 64px; }
  .undated h3 {
    display: flex; align-items: center; gap: 16px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink); font-family: var(--sans);
  }
  .undated h3::after { content: ""; flex: 1; height: 1px; background: var(--hairline); }

  /* ========================= SETTINGS ========================= */
  .settings { padding-top: 12px; max-width: 720px; }
  .settings label {
    display: block; margin: 44px 0 12px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 0.19em; text-transform: uppercase;
    color: var(--ink);
  }
  .settings .hint {
    display: block; margin-top: 5px;
    font-size: 12.5px; font-weight: 400; letter-spacing: 0; text-transform: none;
    color: var(--ink-3); max-width: 62ch;
  }
  textarea, input[type=text], select {
    width: 100%; font-family: var(--serif); font-size: 15.5px; line-height: 1.6;
    color: var(--ink); background: var(--bg-raise);
    border: 1px solid var(--hairline-2); border-radius: 2px; padding: 12px 15px;
  }
  textarea:focus-visible, input[type=text]:focus-visible, select:focus-visible { outline: none; border-color: var(--act); }
  textarea { min-height: 150px; resize: vertical; }
  input[type=text] { font-family: var(--sans); font-size: 14px; }
  select { max-width: 260px; font-family: var(--sans); font-size: 14px; }
  .goal-row {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 0 16px; border-bottom: 1px solid var(--hairline);
  }
  .goal-row .desc { flex: 1; font-family: var(--serif); font-size: 15.5px; }
  .goal-row .st { font-family: var(--mono); font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .goal-row button { font-size: 10px; padding: 6px 13px; }
  .add-goal { display: flex; gap: 10px; margin-top: 14px; align-items: center; }
  .add-goal input { flex: 1; }
  .save-row { margin-top: 18px; display: flex; gap: 12px; align-items: center; }
  .save-note { color: var(--ink-3); font-size: 12.5px; }
  .settings .goal-hint { padding: 10px 0; font-size: 12.5px; color: var(--ink-3); font-family: var(--serif); font-style: italic; }

  /* ---- toast ---- */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg);
    padding: 9px 18px; border-radius: 999px;
    font-family: var(--sans); font-size: 12px; font-weight: 600; letter-spacing: 0.02em;
    opacity: 0; transition: opacity 160ms; pointer-events: none; z-index: 10;
    max-width: 80%; text-align: center;
  }
  #toast.show { opacity: 1; }

  /* ============================================================
     FLIGHT PLAN
     The existing content model, remapped onto a calm operations
     surface: the persistent action ledger at left, enriched by today's
     briefing context, with the complete brief at right,
     and every secondary collection on the perimeter.
     ============================================================ */
  :root,
  :root.playa {
    --bg: #07101f;
    --bg-raise: #0a1629;
    --ink: #f4f7f5;
    --ink-2: #adb8c1;
    --ink-3: #7e8c9d;
    --hairline: rgba(226, 236, 242, 0.16);
    --hairline-2: rgba(226, 236, 242, 0.28);
    --act: #52cdd5;
    --act-deep: #79dce2;
    --on-act: #07101f;
    --due: #ef6a3d;
    --display: "Avenir Next", Avenir, "Helvetica Neue", system-ui, sans-serif;
    --serif: "Avenir Next", Avenir, "Helvetica Neue", system-ui, sans-serif;
    --sans: "Avenir Next", Avenir, "Helvetica Neue", system-ui, sans-serif;
  }
  :root.playa { --due: #f47a45; }
  html, body { width: 100%; height: 100%; overflow: hidden; min-width: 640px; }
  body { background: var(--bg); font-size: 14px; }
  body::before, body::after { display: none; }

  header.flight-telemetry {
    position: relative; top: auto; height: 64px; z-index: 4;
    border-bottom: 1px solid var(--hairline-2);
    background: #050d19; backdrop-filter: none;
    -webkit-app-region: drag;
  }
  header.flight-telemetry button,
  header.flight-telemetry a { -webkit-app-region: no-drag; }
  .telemetry-grid {
    height: 100%; display: grid;
    grid-template-columns: minmax(250px, 1.45fr) repeat(5, minmax(96px, 1fr)) minmax(128px, 1.1fr);
  }
  .flight-brand, .telemetry-cell {
    min-width: 0; padding: 0 18px; border-right: 1px solid var(--hairline);
    display: flex; flex-direction: column; justify-content: center;
  }
  /* Clear the native macOS traffic lights overlaying the header's left edge. */
  .flight-brand { padding-left: 92px; }
  .flight-brand strong {
    font-size: 17px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase;
  }
  .flight-brand span {
    margin-top: 3px; color: var(--due); font-size: 8px; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase;
  }
  .telemetry-label {
    color: var(--ink-3); font-size: 7.5px; font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; white-space: nowrap;
  }
  .telemetry-value {
    margin-top: 4px; color: var(--ink); font-family: var(--sans);
    font-size: 15px; font-weight: 500; line-height: 1.1; white-space: nowrap;
  }
  .telemetry-value .unit {
    margin-left: 4px; color: var(--ink-3); font-size: 8px;
    letter-spacing: .06em; text-transform: uppercase;
  }
  .telemetry-value.weather-alert { color: var(--due); }
  .telemetry-cell #tminus {
    display: block; border: 0; padding: 0; color: var(--ink);
    font-family: var(--sans); font-size: 12px; letter-spacing: 0; white-space: normal;
  }
  .telemetry-status { gap: 4px; }
  .telemetry-status #lastRun {
    color: var(--ink); font-family: var(--sans); font-size: 10px; letter-spacing: .02em;
  }
  .telemetry-status #runNow {
    align-self: flex-start; padding: 0; border: 0; border-bottom: 1px solid var(--act);
    border-radius: 0; color: var(--act); font-size: 8px; letter-spacing: .12em;
  }

  .flight-shell {
    height: calc(100vh - 112px); display: grid;
    grid-template-columns: minmax(330px, 38%) minmax(0, 62%);
    background: var(--bg); transition: grid-template-columns 220ms ease;
  }
  .flight-shell.queue-collapsed { grid-template-columns: 66px minmax(0, 1fr); }
  .flight-shell.secondary { display: block; }
  #queue {
    min-width: 0; height: 100%; overflow: auto; padding: 27px 30px 34px;
    border-right: 1px solid var(--hairline-2); background: #07101f;
  }
  .flight-shell.secondary #queue { display: none; }
  #main {
    min-width: 0; height: 100%; overflow: auto; padding: 0;
    scrollbar-width: thin; scrollbar-color: #30475d transparent;
  }
  .flight-shell.secondary #main { width: min(1040px, calc(100% - 70px)); margin: 0 auto; padding: 42px 0 90px; }

  nav#side {
    position: relative; top: auto; width: 100%; height: 48px; padding: 0;
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 0;
    border-top: 1px solid var(--hairline-2); background: #050d19;
  }
  #side button {
    min-width: 0; padding: 0 8px; border: 0; border-right: 1px solid var(--hairline);
    border-left: 0; text-align: center; color: var(--ink-3); background: #050d19;
    font-size: 8.5px; letter-spacing: .12em; position: relative;
  }
  #side button:last-child { border-right: 0; }
  #side button:hover, #side button.active { color: var(--ink); background: #050d19; }
  #side button.active::after {
    content: ""; position: absolute; left: 32%; right: 32%; bottom: 0;
    height: 2px; background: var(--act);
  }
  #side .count { color: var(--due); }
  #side .sep { display: none; }

  .queue-header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 15px; border-bottom: 1px solid var(--hairline-2);
  }
  .queue-header .micro b { color: var(--act); }
  .queue-meta { display: flex; align-items: center; gap: 13px; }
  .queue-history-toggle {
    padding: 0 0 2px; border: 0; border-bottom: 1px solid var(--hairline-2);
    border-radius: 0; color: var(--ink-3); font-size: 7.5px; letter-spacing: .1em;
  }
  .queue-history-toggle:hover { color: var(--act); border-bottom-color: var(--act); }
  .queue-collapse {
    width: 23px; height: 23px; padding: 0; border-color: var(--hairline-2);
    border-radius: 0; color: var(--act); font-size: 16px; line-height: 1;
  }
  .queue-collapse:hover { border-color: var(--act); }
  .flight-shell.queue-collapsed #queue { padding: 18px 0; overflow: hidden; }
  .flight-shell.queue-collapsed #queue > :not(.queue-header) { display: none; }
  .flight-shell.queue-collapsed .queue-header {
    height: 100%; padding: 0; border: 0; flex-direction: column;
    justify-content: flex-start; gap: 18px;
  }
  .flight-shell.queue-collapsed .queue-header > .micro {
    writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .flight-shell.queue-collapsed .queue-meta { flex-direction: column; gap: 14px; }
  .flight-shell.queue-collapsed .queue-meta .num {
    writing-mode: vertical-rl; transform: rotate(180deg);
  }
  .flight-shell.queue-collapsed .queue-history-toggle { display: none; }
  .queue-empty {
    padding: 34px 0; color: var(--ink-3); font-size: 12px; line-height: 1.55;
  }
  #queue .followups { margin-top: 0; }
  #queue .fu-head { display: none; }
  #queue .fu-row {
    grid-template-columns: 47px minmax(0, 1fr) 30px;
    gap: 0 10px; align-items: start; padding: 22px 0;
    border-bottom-color: var(--hairline);
  }
  #queue .fu-row .idx {
    padding-top: 1px; color: var(--act); font-family: var(--sans);
    font-size: 18px; font-weight: 400;
  }
  #queue .fu-row .fu-main { display: block; }
  #queue .fu-row .fu-title { color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.3; }
  #queue .fu-row .fu-age {
    display: block; margin-top: 7px; color: var(--due); font-size: 8px;
    letter-spacing: .1em; text-transform: uppercase;
  }
  #queue .fu-row .fu-why {
    grid-column: 2; margin-top: 8px; color: var(--ink-3); font-size: 11px; line-height: 1.45;
  }
  #queue .fu-check {
    width: 27px; height: 27px; border-radius: 0; color: transparent;
    border-color: #728396; align-self: start;
  }
  #queue .fu-check:hover { color: var(--act); border-color: var(--act); }
  #queue .fu-row.done { opacity: .42; }
  #queue .fu-row.done .fu-check { color: var(--bg); background: var(--act); border-color: var(--act); }
  .queue-history { margin-top: 28px; border-top: 1px solid var(--hairline-2); }
  .queue-history-head { padding: 16px 0 2px; color: var(--ink-3); }
  .queue-history .fu-row { opacity: .72; }
  .queue-history .fu-row .fu-title { color: var(--ink-2); }
  .queue-history .fu-row .idx { color: var(--ink-3); }
  .queue-history .fu-row .fu-age { color: var(--ink-3); }
  #queue .queue-history .fu-check { color: var(--bg); background: var(--ink-3); border-color: var(--ink-3); }
  #queue .queue-history .fu-check:hover { color: var(--bg); background: var(--act); }

  .flight-photo {
    min-height: 215px; padding: 23px 38px; display: flex; align-items: flex-start;
    background-image:
      linear-gradient(90deg, rgba(5,13,25,.48), rgba(5,13,25,.08)),
      linear-gradient(0deg, rgba(5,13,25,.52), rgba(5,13,25,.02) 70%),
      var(--backdrop-photo, var(--backdrop-scene));
    background-size: cover; background-position: center 54%; background-repeat: no-repeat;
    border-bottom: 1px solid var(--hairline-2);
  }
  .flight-photo-meta {
    width: 100%; display: flex; justify-content: space-between; gap: 20px;
    color: #d4dadd; font-size: 8px; font-weight: 700;
    letter-spacing: .13em; text-transform: uppercase;
  }
  .flight-photo-meta span:first-child { color: var(--act); }
  .flight-article { width: min(820px, calc(100% - 70px)); margin: 0 auto; padding: 0 0 90px; }
  .flight-article .day-nav { padding-top: 23px; }
  .flight-article .digest { padding-top: 25px; }
  .flight-article .briefing-kicker { margin-bottom: 0; }
  .flight-article .digest-headline {
    margin-top: 17px; max-width: 19em; color: var(--ink);
    font-family: var(--sans); font-size: clamp(34px, 4vw, 48px);
    line-height: 1.05; font-weight: 400; letter-spacing: -.035em;
  }
  .flight-article .stats { display: none; }
  .flight-article .digest-narrative { max-width: 72ch; margin-top: 27px; }
  .flight-article .digest-narrative p,
  .flight-article .digest-narrative p.lede {
    color: var(--ink-2); font-family: var(--sans); font-size: 14px; line-height: 1.65;
  }
  .flight-article .digest-narrative p.lede::first-letter { all: unset; }
  .flight-article .goal-watch {
    margin-top: 34px; padding-top: 20px; border-top: 1px solid var(--hairline-2);
  }
  .flight-article .goal-watch .micro { display: block; margin-bottom: 13px; color: var(--act); }
  .flight-article .goal-watch p {
    margin: 0 0 10px; padding-left: 14px; border-left: 1px solid rgba(50, 198, 232, .45);
    color: var(--ink-3); font-size: 12px; line-height: 1.55;
  }
  .flight-article .goal-watch p:last-child { margin-bottom: 0; }
  .flight-article .principle {
    margin-top: 38px; padding-top: 25px; border-top-color: var(--hairline-2);
  }
  .flight-article .principle .p-name { font-family: var(--sans); font-size: 25px; }
  .flight-article .principle .p-line,
  .flight-article .principle .p-reflection { font-family: var(--sans); }
  .flight-article .digest > .followups { display: none; }

  .flight-shell.secondary .card { border-bottom-color: var(--hairline); }
  .flight-shell.secondary .settings { max-width: 780px; }
  input, textarea, select {
    color: var(--ink); background: #0a1629; border-color: var(--hairline-2);
  }
  #toast { bottom: 63px; background: var(--ink); color: var(--bg); }

  @media (max-width: 820px) {
    html, body { height: auto; overflow: auto; }
    .telemetry-grid { grid-template-columns: 1fr 1fr; height: auto; }
    header.flight-telemetry { height: auto; }
    .flight-brand { grid-column: 1 / -1; min-height: 58px; border-bottom: 1px solid var(--hairline); }
    .telemetry-cell { min-height: 50px; }
    .telemetry-cell:nth-of-type(5), .telemetry-cell:nth-of-type(6) { display: none; }
    .flight-shell { height: auto; display: block; }
    #queue { min-height: 520px; border-right: 0; border-bottom: 1px solid var(--hairline-2); }
    .queue-collapse { display: none; }
    .flight-shell.queue-collapsed #queue { padding: 27px 30px 34px; overflow: auto; }
    .flight-shell.queue-collapsed #queue > :not(.queue-header) { display: block; }
    .flight-shell.queue-collapsed .queue-header {
      height: auto; padding-bottom: 15px; border-bottom: 1px solid var(--hairline-2);
      flex-direction: row; justify-content: space-between; gap: 0;
    }
    .flight-shell.queue-collapsed .queue-header > .micro,
    .flight-shell.queue-collapsed .queue-meta .num { writing-mode: initial; transform: none; }
    .flight-shell.queue-collapsed .queue-meta { flex-direction: row; gap: 13px; }
    .flight-shell.queue-collapsed .queue-history-toggle { display: inline-block; }
    #main { height: auto; overflow: visible; }
    nav#side { position: sticky; bottom: 0; z-index: 8; grid-template-columns: repeat(3, 1fr); height: auto; }
    #side button { min-height: 45px; }
  }
  /* ---- full-screen sheets (first-run consent, connect-an-AI) ---------------
     A porcelain sheet over everything; the copy does the work in plain words. */
  .sheet {
    position: fixed; inset: 0; z-index: 100;
    background: var(--bg);
    overflow-y: auto;
    display: grid; place-items: safe center;
  }
  .sheet-inner {
    max-width: 600px; padding: 64px 36px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .sheet-inner h1 {
    font-family: var(--display); font-weight: 400;
    font-size: 34px; line-height: 1.15; margin: 6px 0 2px;
  }
  .sheet-inner .sheet-rule { border-top: 1px solid var(--hairline-2); }
  .sheet-inner p {
    font-family: var(--serif); font-size: 15px; line-height: 1.55;
    color: var(--ink-2); margin: 0;
  }
  .sheet-inner p strong { color: var(--ink); font-family: var(--sans); font-size: 14px; }
  .sheet-actions { display: flex; align-items: center; gap: 20px; margin-top: 10px; }
  .sheet-actions[hidden], .fr-bio[hidden] { display: none; }
  .sheet-actions button.primary { padding: 10px 22px; font-size: 15px; }
  .sheet .opt { border-left: 2px solid var(--hairline-2); padding: 2px 0 4px 18px; }
  .sheet .opt p { margin-top: 6px; }
  .sheet code {
    font-family: var(--mono); font-size: 12.5px; color: var(--ink);
    background: var(--bg-raise); border: 1px solid var(--hairline);
    border-radius: 4px; padding: 2px 7px; white-space: nowrap;
  }
  .sheet .copy-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .sheet .copy-row button.ghost { font-size: 12px; }
  .sheet .check-note { min-height: 18px; }
  /* The dusk horizon grounds every full-screen sheet. */
  .sheet::after {
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 38vh;
    background: var(--backdrop-scene) bottom center / cover no-repeat;
    opacity: .3; pointer-events: none;
  }
  .sheet-inner { position: relative; z-index: 1; }

  /* ---- first-run sequence --------------------------------------------------- */
  .fr-stages { display: flex; flex-direction: column; gap: 16px; margin: 4px 0; }
  .fr-stage {
    display: flex; gap: 16px; align-items: baseline;
    opacity: .35; transition: opacity .5s ease;
  }
  .fr-stage.active, .fr-stage.done { opacity: 1; }
  .fr-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: none;
    background: var(--hairline-2); position: relative; top: -1px;
    transition: background .4s;
  }
  .fr-stage.active .fr-dot { background: var(--act); animation: gen-pulse 1.4s ease-in-out infinite; }
  .fr-stage.done .fr-dot { background: var(--act); }
  .fr-label { display: block; font-family: var(--sans); font-size: 14px; color: var(--ink); }
  .fr-detail {
    display: block; margin-top: 3px; font-family: var(--serif); font-style: italic;
    font-size: 13.5px; line-height: 1.45; color: var(--ink-3);
  }
  .fr-detail:empty { display: none; }
  .fr-bio { border-left: 2px solid var(--act); padding: 4px 0 6px 18px; animation: fr-reveal .8s ease; }
  .fr-bio p {
    margin: 8px 0 6px; font-family: var(--serif); font-size: 14.5px; line-height: 1.55;
    color: var(--ink-2); max-height: 132px; overflow: hidden;
    -webkit-mask-image: linear-gradient(#000 65%, transparent);
    mask-image: linear-gradient(#000 65%, transparent);
  }
  .fr-bio .fr-bio-hint { font-size: 11px; color: var(--ink-3); }
  @keyframes fr-reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  #firstrun h1 { transition: opacity .3s; }

  /* ---- first-edition generating indicator & credit ------------------------- */
  .generating { display: flex; align-items: center; gap: 12px; padding: 26px 0 10px; }
  .generating .gen-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--act);
    animation: gen-pulse 1.4s ease-in-out infinite;
  }
  .generating .gen-text {
    font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--ink-2);
  }
  @keyframes gen-pulse {
    0%, 100% { opacity: .25; transform: scale(.8); }
    50% { opacity: 1; transform: scale(1); }
  }
  .playa-credit {
    margin: 44px 0 30px; padding-top: 16px;
    border-top: 1px solid var(--hairline); text-align: center;
  }
  .playa-credit a, a.credit-link {
    font-family: var(--sans); font-size: 9px; font-weight: 600; letter-spacing: .28em;
    text-transform: uppercase; color: var(--ink-3); text-decoration: none;
  }
  .playa-credit a:hover, a.credit-link:hover { color: var(--act); }
</style>
